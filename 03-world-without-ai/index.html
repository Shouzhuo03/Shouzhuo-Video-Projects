<html lang="zh">
<head>
<meta charset="utf-8">
<title>没有 AI 的世界线</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b0c; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; background: #0b0b0c; }
  #cam { position: absolute; }
  #cam iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #0e0e10; display: none; }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 75% at 50% 50%, transparent 65%, rgba(0,0,0,.07) 100%); }

  #ui { position: fixed; box-sizing: border-box; inset: auto 0 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #19191b; color: #ddd; font: 13px system-ui, sans-serif; }
  #ui button, #soundtrack { white-space: nowrap; cursor: pointer; }
  #ui button { color: inherit; background: #313137; border: 1px solid #525258; border-radius: 4px; padding: 4px 9px; }
  #position { flex: 1; min-width: 45px; }
  #clock { min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  #soundtrack { position: relative; }
  #audio-file { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
  #soundtrack:focus-within { outline: 1px solid #ddd; }
  body:not(.preview) #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="cam"></div><div id="vig"></div></div>
<div id="ui">
  <button id="play" type="button">播放</button>
  <input id="position" type="range" min="0" value="0" step="any" aria-label="播放进度">
  <output id="clock" for="position">0.00 s</output>
  <label id="soundtrack">更换配乐<input id="audio-file" type="file" accept="audio/*"></label>
  <audio id="music" src="assets/soundtrack.m4a" preload="metadata"></audio>
</div>

<script>
document.title = FilmCopy.pageTitle;
const VFOV = 58;

const q = new URLSearchParams(location.search);
window.makeScreen = (name, owner) => {
  const frame = owner.createElement('iframe');
  frame.scrolling = 'no';
  frame.title = name;
  frame.srcdoc = '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body>' +
    document.getElementById('screen-' + name).innerHTML + '</body></html>';
  return frame;
};
const frames = {}, SHOTS = [];
let TL, T1 = 0;

function load(name) {
  return new Promise((res) => {
    const f = makeScreen(name, document);
    f.onload = async () => {

      const d = f.contentDocument, st = d.createElement('style');
      st.textContent = 'html.film{width:100vw!important;height:100vh!important;overflow:hidden!important;background:#0e0e10}html.film body{transform-origin:0 0}';
      d.head.appendChild(st); d.documentElement.classList.add('film');
      f.style.display = 'block'; await f.contentWindow.ready; res(f);
    };
    document.getElementById('cam').appendChild(f);
    frames[name] = f;
  });
}

function layout() {
  const st = document.getElementById('stage'), pv = document.body.classList.contains('preview');
  let W = innerWidth, H = innerHeight;
  if (pv) { H = innerHeight - 46; W = Math.round((H * 9) / 16); if (W > innerWidth) { W = innerWidth; H = Math.round((W * 16) / 9); } }
  Object.assign(st.style, { width: W + 'px', height: H + 'px', left: Math.round((innerWidth - W) / 2) + 'px' });

  PLANE = Math.ceil(2.4 * Math.max(W, H));
  Object.assign(document.getElementById('cam').style, { width: PLANE + 'px', height: PLANE + 'px', left: (W - PLANE) / 2 + 'px', top: (H - PLANE) / 2 + 'px' });
  if (last !== null) seek(last);
}
let PLANE = 0, last = null;

window.filmReady = (async () => {
  document.body.classList.toggle('preview', !q.has('capture'));
  layout(); addEventListener('resize', layout);
  TL = window.filmTimeline;
  SHOTS.push(...FILM.layout(TL));
  const SCENES = FILM.SCENES;
  T1 = window.FILM_END = SCENES[SCENES.length - 1].end;
  await Promise.all([...new Set(SCENES.map((s) => s.screen))].map(load));
  await document.fonts.ready;
  for (const n in frames) frames[n].style.display = 'none';
})();

function shotAt(t) { return SHOTS.find((s) => t < s.end) || SHOTS[SHOTS.length - 1]; }
window.shotIdAt = (t) => shotAt(t).id;

const R = 0.7, NS = 14;

const actTime = FILM.actTime;

const optsAt = (t, sh) => ({ ...(sh.scene.opts || {}), T: t });
function aim(t, sh) {
  const s = sh.scene, win = frames[s.screen].contentWindow, f = (u) => win.focusAt(s.act, actTime(u, sh), sh.look, optsAt(u, sh));
  if (!sh.mean) {
    let x = 0, y = 0; for (let i = 0; i <= 24; i++) { const p = f(sh.start + ((sh.end - sh.start) * i) / 24); x += p[0]; y += p[1]; }
    sh.mean = [x / 25, y / 25];
  }
  const lo = sh.clampStart ? sh.start + 2e-3 : -1e9, hi = sh.clampEnd ? sh.end - 2e-3 : 1e9;
  let x = 0, y = 0;
  for (let i = 0; i <= NS; i++) { const u = Math.min(hi, Math.max(lo, t - R + (2 * R * i) / NS)), p = f(u); x += p[0]; y += p[1]; }

  const fo = sh.follow ?? 0.85, k = (t - sh.start) / (sh.end - sh.start), pan = sh.pan || [0, 0], p2 = sh.pan2 || [0, 0];
  const e = sh.panE === 'out' ? 1 - (1 - k) * (1 - k) : sh.panE === 'in' ? k * k : k;

  const off = sh.off || [0, 0];
  return [sh.mean[0] + (x / (NS + 1) - sh.mean[0]) * fo + pan[0] * (e - 0.5) + p2[0] * (k * k - 0.5) + off[0], sh.mean[1] + (y / (NS + 1) - sh.mean[1]) * fo + pan[1] * (e - 0.5) + p2[1] * (k * k - 0.5) + off[1]];
}

function camera(t, sh) {
  const st = document.getElementById('stage'), cam = document.getElementById('cam');
  const W = st.clientWidth, H = st.clientHeight, f = H / (2 * Math.tan((VFOV * Math.PI) / 360));
  const k = Math.min(1, Math.max(0, (t - sh.start) / (sh.end - sh.start)));
  const w = Math.exp(Math.log(sh.w[0]) + (Math.log(sh.w[1]) - Math.log(sh.w[0])) * k), sc = W / w;
  const [tx, ty] = aim(t, sh), [rx, ry, rz] = sh.a;
  st.style.perspective = f + 'px'; st.style.perspectiveOrigin = `${W / 2}px ${H / 2}px`;
  cam.style.transformOrigin = '50% 50%';
  cam.style.transform = `rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg)`;
  return { sc, tx, ty, W, H, f };
}

let shown = null, CAM = null;
window.seek = async (t) => {
  await window.filmReady;
  last = t;
  const sh = shotAt(t), s = sh.scene, fr = frames[s.screen], body = fr.contentDocument.body, opts = optsAt(t, sh);
  if (shown !== s.screen) { for (const n in frames) frames[n].style.display = n === s.screen ? 'block' : 'none'; shown = s.screen; }
  body.style.transform = 'none';
  fr.contentWindow.renderAt(s.act, actTime(t, sh), opts);
  CAM = { ...camera(t, sh), a: sh.a };
  if (fr.contentWindow.focusMutates) fr.contentWindow.renderAt(s.act, actTime(t, sh), opts);
  body.style.transform = `translate(${PLANE / 2 - CAM.tx * CAM.sc}px, ${PLANE / 2 - CAM.ty * CAM.sc}px) scale(${CAM.sc})`;
  if (fr.contentWindow.settled) await fr.contentWindow.settled();
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
};

window.camInfo = () => {
  const { W, H, f, sc, tx, ty, a: [rx, ry, rz] } = CAM;
  const R = new DOMMatrix().rotateAxisAngle(0, 0, 1, rz).rotateAxisAngle(1, 0, 0, rx).rotateAxisAngle(0, 1, 0, ry);
  const A = R.transformPoint({ x: 1, y: 0, z: 0 }), B = R.transformPoint({ x: 0, y: 1, z: 0 });
  return { t: last, shot: shotAt(last).id, W, H, f, sc, tx, ty, A: [A.x, A.y, A.z], B: [B.x, B.y, B.z] };
};

window.animationReady = window.filmReady.then(() => ({duration: T1, seek: window.seek, camera: () => ({...window.camInfo(), dpr: devicePixelRatio})}));
openPreview(window.animationReady);
</script>
</body>
