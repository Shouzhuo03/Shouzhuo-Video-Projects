  #world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0; }
  #world div, #world img, #world span.b { position: absolute; }
  #world .flow, #world .flow * { position: static; }
  #world img { display: block; }
  #player { position: absolute; inset: 0; display: none; background: rgba(0,0,0,0); }
  #player img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
  #outro { position: absolute; inset: 0; overflow: hidden; display: none; pointer-events: none; }
  #oin { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #oin div, #oin span.g, #oin img { position: absolute; }
  #oin .flow, #oin .flow * { position: static; }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 75% at 50% 50%, transparent 65%, rgba(0,0,0,.07) 100%); }
  .ch { display: inline-block; white-space: pre; }

  #ui { position: fixed; box-sizing: border-box; inset: auto 0 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #19191b; color: #ddd; font: 13px system-ui, sans-serif; }
  #ui button { white-space: nowrap; cursor: pointer; }
  #ui button { color: inherit; background: #313137; border: 1px solid #525258; border-radius: 4px; padding: 4px 9px; }
  #position { flex: 1; min-width: 45px; }
  #clock { min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  body:not(.preview) #ui { display: none; }
</style>
</head>
<body>

<div id="ui">
  <button id="play" type="button">播放</button>
  <input id="position" type="range" min="0" value="0" step="any" aria-label="播放进度">
  <output id="clock" for="position">0.00 s</output>
</div>
<script src="config.js"></script>
<script src="media.js"></script>

<script>
const {FPS, W, H, clamp, lerp, brake01, spike01, springStep, springTo} = M;
const {F, SHOTS, shotIndex, IN, X, BAR, GRAB_AT, AI, WIN, CONV, CANVAS, COPY, PLAY_FRAMES, KEYS, REPLY3_T} = STORY;
const q = new URLSearchParams(location.search);
const CJK_FONT = '"Noto Sans SC Fallback", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC"';
const UI_FONT = `Inter, SHS, ${CJK_FONT}, sans-serif`;
const SERIF_FONT = `SHSerif, "Songti SC", "SimSun", ${CJK_FONT}, serif`;
document.title = FilmCopy.pageTitle;
const GRAY = '#536471', INK = '#0F1419', LINE = '#EFF3F4';
const capture = q.has('capture');
document.body.classList.toggle('preview', !capture);

const world = document.getElementById('world');
function el(parent, tag, style = {}, html) {
  const e = document.createElement(tag);
  Object.assign(e.style, style);
  if (html !== undefined) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
const box = (parent, x, y, style = {}, html) => el(parent, 'div', {left: x + 'px', top: y + 'px', ...style}, html);
const measure = document.createElement('canvas').getContext('2d');
function fitText(element, value, maxWidth) {
  const style = getComputedStyle(element);
  measure.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
  const width = measure.measureText(value).width;
  if (width > maxWidth) element.style.fontSize = `${parseFloat(style.fontSize) * maxWidth / width}px`;
}
const textBox = (parent, x, y, style, value) => {
  const e = box(parent, x, y, style);
  e.textContent = value;
  return e;
};
const pending = [];
function setSrc(img, src) {
  if (img.dataset.src === src) return;
  img.dataset.src = src; img.src = src;
  pending.push(img.decode().catch(() => {}));
}

const ENTER = {...TUNE.global.enter, settle: 45};
function enter(e, f, f0, size, o = {}) {
  const u = f - f0, s = e.style;
  if (u < 0) { s.opacity = 0; return; }
  if (u > ENTER.settle) { s.opacity = ''; s.filter = ''; s.transform = o.keep || ''; return; }
  const {blur = ENTER.blur, dy = ENTER.dy, s0 = ENTER.s0, origin = '50% 80%'} = o;
  const k = springStep(u / FPS, ENTER.hz, ENTER.zeta), b = blur * size * (1 - brake01(u, 0));
  s.opacity = clamp((u + 1) / 3);
  s.filter = b > 0.02 ? `blur(${b.toFixed(3)}px)` : '';
  s.transform = `translateY(${(dy * size * (1 - k)).toFixed(3)}px) scale(${(s0 + (1 - s0) * k).toFixed(4)})` + (o.keep ? ' ' + o.keep : '');
  s.transformOrigin = origin;
}
const startCache = new Map();
function revealStarts(n, f0, peak) {
  const key = `${n}|${f0}|${peak}`;
  if (startCache.has(key)) return startCache.get(key);
  const s = [];
  for (let i = 0; i < n; i++) {
    const target = (0.9 * i) / n;
    let lo = f0, hi = f0 + 300;
    for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (spike01(m, f0, peak) >= target) hi = m; else lo = m; }
    s.push(i === 0 ? f0 : hi);
  }
  startCache.set(key, s);
  return s;
}

function chars(parent, segs, size, f0, peak) {
  const spans = [];
  for (const sg of segs) for (const c of Array.from(sg.t)) { const sp = el(parent, 'span', sg.style || {}); sp.className = 'ch'; sp.textContent = c; spans.push(sp); }
  const starts = revealStarts(spans.length, f0, peak);
  return {end: starts[starts.length - 1], update: (f) => spans.forEach((sp, i) => enter(sp, f, starts[i], size))};
}
const line = (e, f, f0) => { e.style.transform = f < f0 ? 'scaleX(0)' : `scaleX(${brake01(f, f0)})`; e.style.transformOrigin = '0 50%'; };

const svg = (size, inner, color = GRAY, fill = 'none', sw = 1.8) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="display:block">${inner}</svg>`;
const ICON = {
  back: svg(20, '<path d="M19 12H5M11 6l-6 6 6 6"/>', INK, 'none', 2),
  more: svg(18, `<circle cx="5" cy="12" r="1" fill="${GRAY}"/><circle cx="12" cy="12" r="1" fill="${GRAY}"/><circle cx="19" cy="12" r="1" fill="${GRAY}"/>`),
  reply: svg(19, '<path d="M4 11.5a7.5 7 0 0 1 7.5-7h1A7.5 7 0 0 1 20 11.5c0 4-3.4 7-7.5 7H11l-5 3v-4A7 7 0 0 1 4 11.5z"/>'),
  repost: svg(19, '<path d="M7 7h10l-3-3M17 7v7M17 17H7l3 3M7 17v-7"/>', '#00BA7C'),
  like: svg(19, '<path d="M12 20s-7-4.4-8.6-8.6C2.2 8 4.4 5 7.4 5c2 0 3.4 1.2 4.6 2.6C13.2 6.2 14.6 5 16.6 5c3 0 5.2 3 4 6.4C19 15.6 12 20 12 20z"/>', '#F91880', '#F91880'),
  bookmark: svg(19, '<path d="M6 3h12v18l-6-4-6 4z"/>', '#1D9BF0', '#1D9BF0'),

  play: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M7 4.5v15l12-7.5z" fill="#fff"/></svg>`,
  pause: '<svg width="24" height="24" viewBox="0 0 24 24" style="display:block"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z" fill="#fff"/></svg>',

  up: svg(28, '<path d="M12 19V5M6 11l6-6 6 6"/>', '#fff', 'none', 2.6),
};

  backgroundSize: `${CANVAS.gridStep}px ${CANVAS.gridStep}px`, backgroundPosition: '-1px -1px'});

const xpage = box(world, 0, 0);
const XP = {};
(() => {
  const c = X.col;
  box(xpage, c.x, -3000, {width: c.w + 'px', height: '7000px', borderLeft: `1px solid ${LINE}`, borderRight: `1px solid ${LINE}`, boxSizing: 'border-box'});
  XP.header = box(xpage, c.x, 0, {width: c.w + 'px', height: X.headerH + 'px', borderBottom: `1px solid ${LINE}`, boxSizing: 'border-box'});
  box(XP.header, 16, 16, {}, ICON.back);
  textBox(XP.header, 70, 12, {font: `700 20px/28px ${UI_FONT}`, color: INK}, COPY.header);
  XP.avatar = el(xpage, 'img', {left: X.avatar.x + 'px', top: X.avatar.y + 'px', width: X.avatar.d + 'px', height: X.avatar.d + 'px', borderRadius: '50%'});
  XP.avatar.src = AVATAR;
  const name = box(xpage, 464, X.nameY, {font: `700 15px/20px ${UI_FONT}`, color: INK, whiteSpace: 'nowrap', display: 'flex', alignItems: 'center', gap: '3px'});
  const nameText = el(name, 'span', {position: 'static'});

  XP.badge = el(name, 'span', {position: 'static', display: 'inline-flex'}, ICON.badge);
  XP.handle = chars(box(xpage, 464, X.handleY, {font: `400 15px/20px ${UI_FONT}`, color: GRAY, whiteSpace: 'nowrap'}), [{t: COPY.handle}], 15, IN.handle.f0, IN.handle.peak);
  XP.more = box(xpage, c.x + c.w - 36, X.nameY + 4, {}, ICON.more);
  XP.text = chars(box(xpage, X.text.x, X.text.y, {font: `400 ${X.text.size}px/24px ${UI_FONT}`, color: INK, whiteSpace: 'nowrap'}), [{t: COPY.tweet}], X.text.size, IN.text.f0, IN.text.peak);

  const v = X.video;
  XP.video = box(xpage, v.x, v.y, {width: v.w + 'px', height: v.h + 'px', borderRadius: '16px', overflow: 'hidden', border: '1px solid #CFD9DE', background: '#000', boxSizing: 'border-box'});
  XP.poster = el(XP.video, 'img', {left: 0, top: 0, width: '100%', height: '100%', objectFit: 'cover'}); XP.poster.src = VIDEO_PLACEHOLDERS.en;
  XP.frame = el(XP.video, 'img', {left: 0, top: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'none'});
  XP.bigPlay = box(XP.video, v.w / 2 - 34, v.h / 2 - 34, {width: '68px', height: '68px', borderRadius: '50%', background: 'rgba(15,20,25,.62)', border: '2px solid rgba(255,255,255,.9)', boxSizing: 'border-box', display: 'grid', placeItems: 'center'},
    `<div class="flow" style="margin-left:5px">${ICON.play(30)}</div>`);
  XP.dur = box(XP.video, 12, v.h - 34, {padding: '1px 6px', borderRadius: '4px', background: 'rgba(0,0,0,.6)', color: '#fff', font: `500 13px/20px ${UI_FONT}`}, '0:20');
  XP.ctrl = box(XP.video, 0, v.h - 74, {width: '100%', height: '74px', background: 'linear-gradient(transparent, rgba(0,0,0,.55))'});
  const track = box(XP.ctrl, 12, 14, {width: v.w - 24 + 'px', height: '3px', borderRadius: '2px', background: 'rgba(255,255,255,.35)'});
  XP.prog = box(track, 0, 0, {height: '100%', width: '0%', background: '#fff', borderRadius: '2px'});
  XP.pp = box(XP.ctrl, 12, 38);
  XP.time = box(XP.ctrl, v.w - 196, 41, {color: '#fff', font: `500 15px/20px ${UI_FONT}`});
  box(XP.ctrl, v.w - 108, 40, {display: 'flex', gap: '14px'}, ['M4 6h16v12H4zM10 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3', 'M4 10h3l5-4v12l-5-4H4zM16 9l5 6M21 9l-5 6', 'M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6']
    .map((d) => `<div class="flow">${ICON.ctl(d)}</div>`).join(''));

  XP.tr = box(xpage, 0, 0, {width: '1400px', height: '400px'});
  const bar = box(XP.tr, BAR.x, BAR.y, {width: BAR.w + 'px', height: BAR.h + 'px', padding: '0 8px', boxSizing: 'border-box', background: '#111', whiteSpace: 'nowrap',
    font: `700 ${BAR.size}px/${BAR.h}px ${SERIF_FONT}`, color: '#fff', borderRadius: '3px'});
  XP.translation = el(bar, 'span', {position: 'static', display: 'inline-block', whiteSpace: 'pre'});
  for (const part of COPY.translation) {
    el(XP.translation, 'span', {position: 'static', color: part.hl ? '#6FE59A' : '#fff'}).textContent = part.t;
  }

  XP.meta = chars(box(xpage, X.text.x, X.metaY, {font: `400 15px/20px ${UI_FONT}`, color: GRAY, whiteSpace: 'nowrap'}),
    [{t: COPY.meta[0]}, {t: COPY.meta[1], style: {color: INK, fontWeight: 700}}, {t: COPY.meta[2]}], 15, IN.meta.f0, IN.meta.peak);
  XP.div1 = box(xpage, X.text.x, X.div1, {width: '568px', height: '1px', background: LINE});
  const counts = [[ICON.reply, COPY.counts.reply, GRAY], [ICON.repost, COPY.counts.repost, '#00BA7C'], [ICON.like, COPY.counts.like, '#F91880'], [ICON.bookmark, COPY.counts.bookmark, '#1D9BF0']];
  XP.actions = counts.map(([icon, n, color], i) => {
    const x = X.text.x + 4 + i * 128;
    const ic = box(xpage, x, X.actionsY, {}, icon);
    const num = chars(box(xpage, x + 25, X.actionsY, {font: `400 14px/19px ${UI_FONT}`, color, whiteSpace: 'nowrap'}), [{t: n}], 14, IN.actions + 2 * i + 1, 2);
    return {ic, num, f0: IN.actions + 2 * i};
  });
  XP.share = box(xpage, X.text.x + 545, X.actionsY, {}, ICON.share);
  XP.div2 = box(xpage, X.text.x, X.div2, {width: '568px', height: '1px', background: LINE});
  XP.replyAv = box(xpage, X.text.x, X.replyY, {width: '40px', height: '40px', borderRadius: '50%', background: '#CFD9DE'});
  XP.replyPh = chars(box(xpage, X.text.x + 52, X.replyY + 7, {font: `400 20px/26px ${UI_FONT}`, color: GRAY, whiteSpace: 'nowrap'}), [{t: COPY.replyPlaceholder}], 20, IN.reply + 2, 3);
  XP.replyBtn = box(xpage, X.text.x + 568 - 70, X.replyY + 2, {padding: '8px 18px', borderRadius: '999px', background: '#8E9BA3', color: '#fff', font: `700 15px/20px ${UI_FONT}`, whiteSpace: 'nowrap'}, '回复');
})();

const dimEl = box(world, X.video.x, X.video.y, {width: X.video.w + 'px', height: X.video.h + 'px', borderRadius: '16px', zIndex: 5, pointerEvents: 'none', display: 'none'});
function drawDim(f) {
  const a = f < F.drag1 ? RIG.dim(f) : 0;
  dimEl.style.display = a > 0.002 ? 'block' : 'none';
  if (a > 0.002) dimEl.style.boxShadow = `0 0 0 9000px rgba(8,8,10,${a.toFixed(4)})`;
}

function drawX(f) {
  const v = X.video;
  enter(XP.header, f, IN.header, 30, {blur: 0.12, dy: 0.3, origin: '50% 50%'});
  enter(XP.avatar, f, IN.avatar, X.avatar.d, {blur: 0.15, dy: 0.3, origin: '50% 50%'});
  XP.name.update(f); enter(XP.badge, f, XP.name.end + 1, 18, {origin: '50% 50%'});
  XP.handle.update(f); enter(XP.more, f, IN.more, 18, {origin: '50% 50%'});
  XP.text.update(f);

  enter(XP.video, f, IN.video, 40, {blur: 0.12, dy: 0.5, s0: 0.9, origin: '50% 0%'});
  if (f >= F.grab) XP.video.style.opacity = 1 - 0.7 * clamp((f - F.grab) / 5);
  const playing = f >= F.play;
  XP.poster.style.display = playing ? 'none' : 'block';
  XP.frame.style.display = playing ? 'block' : 'none';
  if (playing) setSrc(XP.frame, VIDEO_PLACEHOLDERS.en);
  const big = f < F.play ? 1 : clamp(1 - (f - F.play) / 3);
  XP.bigPlay.style.opacity = big; XP.dur.style.opacity = big;
  const ctrl = f < F.play ? 0 : f < F.away0 + 6 ? 1 : f < F.ret1 ? clamp(1 - (f - F.away0 - 6) / 8) : clamp((f - F.ret1) / 4) * clamp(1 - (f - F.grab) / 4);
  XP.ctrl.style.opacity = ctrl;
  const playEnd = F.play + PLAY_FRAMES, secs = Math.min(Math.floor(Math.max(0, f - F.play) / FPS), Math.floor(PLAY_FRAMES / FPS));
  XP.time.textContent = `0:${String(secs).padStart(2, '0')} / 0:20`;
  XP.prog.style.width = (f < F.play ? 0 : clamp((Math.min(f, playEnd) - F.play) / FPS / 20.4) * 100) + '%';
  const pp = f < playEnd ? 'pause' : 'play';
  if (XP.pp.dataset.k !== pp) { XP.pp.dataset.k = pp; XP.pp.innerHTML = pp === 'pause' ? ICON.pause : ICON.play(24); }

  const wx = RIG.wipeX(f);
  const m = wx < -1000 ? 'linear-gradient(90deg, transparent, transparent)' : wx > 1000 ? 'none' : `linear-gradient(90deg, #000 0px, #000 ${(wx - 3).toFixed(2)}px, transparent ${(wx + 3).toFixed(2)}px)`;
  XP.tr.style.webkitMaskImage = m; XP.tr.style.maskImage = m;
  XP.meta.update(f); line(XP.div1, f, IN.div1);
  for (const a of XP.actions) { enter(a.ic, f, a.f0, 19, {origin: '50% 50%'}); a.num.update(f); }
  enter(XP.share, f, IN.actions + 8, 19, {origin: '50% 50%'});
  line(XP.div2, f, IN.div2);
  enter(XP.replyAv, f, IN.reply, 40, {blur: 0.15, dy: 0.3, origin: '50% 50%'});
  XP.replyPh.update(f);
  enter(XP.replyBtn, f, IN.reply + 6, 34, {blur: 0.12, dy: 0.3, origin: '50% 50%'});
}

const T = (x, y) => `translate(${(+x).toFixed(3)}px, ${(+y).toFixed(3)}px)`;
const sheet = box(world, -3000, 0, {width: '8000px', height: '6000px', background: AI.bg, boxShadow: '0 16px 44px rgba(40,34,24,.2), 0 2px 6px rgba(40,34,24,.12)', borderBottom: `1px solid ${AI.line}`, boxSizing: 'border-box', display: 'none'});
const tab = box(world, 0, 0, {width: RIG.TAB.w + 'px', height: RIG.TAB.h + 'px', background: AI.bg, borderRadius: '0 0 18px 18px',
  boxShadow: '0 6px 14px rgba(40,34,24,.16), 0 1px 3px rgba(40,34,24,.1)', display: 'none', placeItems: 'center'}, `<div class="flow">${ICON.chevron}</div>`);

const tabSeam = el(tab, 'div', {left: '-6px', top: '-8px', width: RIG.TAB.w + 12 + 'px', height: '9px', background: AI.bg});

const canvasUnder = box(world, 0, 0, {display: 'none'});
const aipage = box(world, 0, 0, {display: 'none'});
const AP = {};
(() => {
  const c = AI.composer, B = AI.send, V = CONV;

  AP.win = box(aipage, WIN.x, WIN.y, {width: WIN.w + 'px', height: WIN.h + 'px', background: AI.bg, borderRadius: WIN.r + 'px', overflow: 'hidden', display: 'none',
    boxShadow: '0 40px 110px rgba(40,34,24,.18), 0 8px 26px rgba(40,34,24,.12), 0 0 0 1px rgba(40,34,24,.12)'});
  const side = box(AP.win, 0, 0, {width: WIN.side + 'px', height: WIN.h + 'px', background: AI.side, borderRight: `1px solid ${AI.sideLine}`, boxSizing: 'border-box'});
  [0, 1, 2].forEach((i) => box(side, 20 + i * 20, 16, {width: '12px', height: '12px', borderRadius: '50%', background: '#CFCBC1'}));
  box(side, 14, 58, {width: WIN.side - 28 + 'px', height: '38px', borderRadius: '10px', background: '#FFFFFF', border: `1px solid ${AI.line}`, boxSizing: 'border-box', padding: '0 12px', display: 'flex', alignItems: 'center', gap: '8px',
    font: `500 15px/20px ${UI_FONT}`, color: AI.ink, whiteSpace: 'nowrap'}, `<span class="flow" style="display:inline-flex">${svg(16, '<path d="M12 5v14M5 12h14"/>', AI.ink, 'none', 2)}</span><span style="position:static">新对话</span>`);
  box(side, 22, 124, {font: `500 12px/16px ${UI_FONT}`, color: '#A19D93', whiteSpace: 'nowrap'}, '最近');
  COPY.window.chats.forEach((t, i) => textBox(side, 12, 146 + i * 36, {width: WIN.side - 24 + 'px', height: '32px', borderRadius: '8px', background: i === 0 ? '#DEDBD2' : 'transparent', boxSizing: 'border-box',
    padding: '0 10px', font: `400 14px/32px ${UI_FONT}`, color: i === 0 ? AI.ink : '#6F6C64', whiteSpace: 'nowrap', overflow: 'hidden'}, t));
  box(AP.win, WIN.side, 0, {width: WIN.w - WIN.side + 'px', height: WIN.bar + 'px', borderBottom: `1px solid ${AI.sideLine}`, boxSizing: 'border-box', display: 'grid', placeItems: 'center',

  const cam = RIG.camAt(frame, shotIndex(frame));
  const distance = SH / (2 * Math.tan((58 * Math.PI) / 360));
  const rotation = new DOMMatrix().rotateAxisAngle(0, 0, 1, cam.rz).rotateAxisAngle(1, 0, 0, cam.rx).rotateAxisAngle(0, 1, 0, cam.ry);
  const axis = point => {
    const {x, y, z} = rotation.transformPoint(point);
    return [x, y, z];
  };
  return {dpr: devicePixelRatio, W: SW, H: SH, f: distance, sc: SW / cam.w, tx: cam.cx, ty: cam.cy,
    A: axis({x: 1, y: 0, z: 0}), B: axis({x: 0, y: 1, z: 0})};
}

window.animationReady = window.filmReady.then(() => ({
  duration: F.end / FPS,
  seek(t) { return window.seek(Math.min(F.end - 1, Math.floor(t * FPS + 1e-8))); },
  drawSample(frame, offset) {
    if (offset === 0) return window.seek(frame, frame);
    return window.seek(frame + offset * TUNE.global.shutter, frame);
  },
  camera: captureCamera,
  samples(frame, width) { return window.subframes(frame, width); }
}));
openPreview(window.animationReady);
</script>
